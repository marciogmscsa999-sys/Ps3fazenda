name: Build PS3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc libgmp10 libmpfr6 libmpc3 libelf1 zlib1g python2.7

      - name: Baixar ferramentas do PS3
        run: |
          curl -sL https://github.com/bucanero/ps3toolchain/releases/download/ubuntu-latest-fad3b5fb/ps3dev-ubuntu-latest-2020-08-31.tar.gz | tar xz -C ./
          ls ps3dev

      - name: Compilar e gerar o PKG
        run: |
          export PS3DEV=$PWD/ps3dev
          export PSL1GHT=$PS3DEV
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin
          make pkg

      - name: Guardar o resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps3-build
          path: |
            main.elf
            main.self
            main.pkg
          if-no-files-found: warn
